name: Build Pokemon broad market dashboard
on:
  workflow_dispatch:
  schedule:
    - cron: '27 21 * * *'
  push:
    paths:
      - 'market-sweep.mjs'
      - '.github/workflows/market-sweep.yml'
permissions:
  contents: write
concurrency:
  group: pokemon-broad-market
  cancel-in-progress: false
jobs:
  market-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh rotating Pokemon sets from TCGCSV
        run: node market-sweep.mjs
      - name: Commit public market data
        run: |
          if git diff --quiet -- data/market-universe.json data/market-sweep-state.json data/market-board.json; then
            echo "No updated market data"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market-universe.json data/market-sweep-state.json data/market-board.json
          git commit -m "data: update broad Pokémon market guide coverage"
          git pull --rebase origin main
          git push
