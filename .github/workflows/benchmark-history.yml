name: Update historical market comparison
on:
  workflow_dispatch:
  schedule:
    - cron: '18 22 * * *'
permissions:
  contents: write
concurrency:
  group: historical-comparison
  cancel-in-progress: false
jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and validate real benchmark history
        run: python scripts/fetch-benchmark-history.py
      - name: Publish actual history
        run: |
          git config user.name "tradr151-market-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market-benchmarks.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh published market comparison history"
            git push
          fi
