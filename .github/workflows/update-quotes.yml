name: Refresh public card guide quotes
on:
  workflow_dispatch:
  push:
    paths:
      - 'data/featured-cards.json'
      - '.github/workflows/update-quotes.yml'
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh TCGdex public quotes
        run: node update-quotes.mjs
      - name: Commit updated quote feed
        run: |
          if git diff --quiet -- data/quotes.json; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quotes.json
          git commit -m "data: refresh public TCGdex guide quotes"
          git push
